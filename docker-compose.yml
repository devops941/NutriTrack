version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nutritrack_backend
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
    networks:
      - nutritrack_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nutritrack_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - nutritrack_net

networks:
  nutritrack_net:
    driver: bridge
